name: UI tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Robot Framework, Browser library and the browser
        run: |
          pip install -r requirements.txt
          rfbrowser install --with-deps ${{ matrix.browser }}

      - name: Run tests
        run: >
          robot --argumentfile robot.args
          --variable BROWSER:${{ matrix.browser }}
          --outputdir results/${{ matrix.browser }}
          tests

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-report-${{ matrix.browser }}
          path: results/${{ matrix.browser }}
